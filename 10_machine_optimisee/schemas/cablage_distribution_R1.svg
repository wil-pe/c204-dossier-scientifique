<rect x="1140" y="300" width="7" height="110" rx="3" fill="#6250d6"/>
<text x="1156" y="320" font-size="13" font-weight="700" fill="#0b0b0b">F4 : fusible 1 A — 6,0 W (0,55 A)</text>
<text x="1156" y="338.0" font-size="11.5" fill="#52514e">12 V direct</text>
<text x="1156" y="353.5" font-size="11.5" fill="#52514e">micro-pompe, ventilateur ;</text>
<text x="1156" y="369.0" font-size="11.5" fill="#52514e">détecteur de fuite dans le bac</text>
<text x="1156" y="384.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
