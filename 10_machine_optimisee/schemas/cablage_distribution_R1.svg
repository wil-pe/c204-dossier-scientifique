<text x="1156" y="488.0" font-size="11.5" fill="#52514e">12 V</text>
<text x="1156" y="503.5" font-size="11.5" fill="#52514e">bobines du relais de sécurité,</text>
<text x="1156" y="519.0" font-size="11.5" fill="#52514e">pertes des convertisseurs</text>
<text x="1156" y="534.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
