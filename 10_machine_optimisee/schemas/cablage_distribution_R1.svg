<text x="416" y="338.0" font-size="11.5" fill="#52514e">convertisseur bas bruit 12 → 5 / 3,3 V</text>
<text x="416" y="353.5" font-size="11.5" fill="#52514e">4 horloges au césium miniatures,</text>
<text x="416" y="369.0" font-size="11.5" fill="#52514e">comparateur de phase</text>
<text x="416" y="384.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
