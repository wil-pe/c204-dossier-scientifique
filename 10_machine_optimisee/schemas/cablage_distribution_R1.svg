<text x="786" y="488.0" font-size="11.5" fill="#52514e">12 V et 5 V</text>
<text x="786" y="503.5" font-size="11.5" fill="#52514e">pupitre, télécommande (bus CAN),</text>
<text x="786" y="519.0" font-size="11.5" fill="#52514e">avertisseur</text>
<text x="786" y="534.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
