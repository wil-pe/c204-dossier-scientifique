<text x="46" y="488.0" font-size="11.5" fill="#52514e">convertisseur 12 → 5 V</text>
<text x="46" y="503.5" font-size="11.5" fill="#52514e">télescope à muons, gyromètre,</text>
<text x="46" y="519.0" font-size="11.5" fill="#52514e">cartes de proximité</text>
<text x="46" y="534.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
