<text x="46" y="320" font-size="13" font-weight="700" fill="#0b0b0b">F1 : fusible 3 A — 19,0 W (1,75 A)</text>
<text x="46" y="338.0" font-size="11.5" fill="#52514e">convertisseur 12 → 5 V</text>
<text x="46" y="353.5" font-size="11.5" fill="#52514e">3 calculateurs dissemblables,</text>
<text x="46" y="369.0" font-size="11.5" fill="#52514e">voteur, récepteur GNSS</text>
<text x="46" y="384.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
