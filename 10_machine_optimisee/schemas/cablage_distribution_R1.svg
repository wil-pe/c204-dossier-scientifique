<text x="24" y="36" font-size="20" font-weight="700" fill="#0b0b0b">C204-R1 — câblage et distribution (très basse tension)</text>
<text x="24" y="60" font-size="13" fill="#52514e">Une seule source (batterie 12,8 V), un fusible général au plus près de la borne +, un coupe-batterie, une chaîne d&#x27;arrêt d&#x27;urgence à double canal, puis des départs protégés un par un.</text>
<text x="24" y="78" font-size="13" fill="#52514e">Aucune tension supérieure à ≈ 30 V (polarisation des photodétecteurs, produite sur leur carte). Calibres : script i12, guide/protections_R1.csv. Estimations — rien n&#x27;a été construit.</text>
<rect x="30" y="120" width="230" height="100" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="2.2"/>
<rect x="30" y="120" width="7" height="100" rx="3" fill="#eb6834"/>
<text x="46" y="140" font-size="13" font-weight="700" fill="#0b0b0b">Batterie LiFePO4 12,8 V</text>
<text x="46" y="158.0" font-size="11.5" fill="#52514e">4 éléments en série, 1,34 kWh</text>
<text x="46" y="173.5" font-size="11.5" fill="#52514e">BMS intégré (surcharge, décharge,</text>
<text x="46" y="189.0" font-size="11.5" fill="#52514e">court-circuit, température)</text>
<text x="46" y="204.5" font-size="11.5" fill="#52514e">dans un bac, loin des horloges</text>
<rect x="300" y="135" width="170" height="70" rx="7" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<rect x="300" y="135" width="7" height="70" rx="3" fill="#e34948"/>
<text x="316" y="155" font-size="13" font-weight="700" fill="#0b0b0b">F0 : fusible 10 A</text>
<text x="316" y="173.0" font-size="11.5" fill="#52514e">à &lt; 15 cm de la borne +</text>
<text x="316" y="188.5" font-size="11.5" fill="#52514e">fort pouvoir de coupure</text>
<rect x="510" y="135" width="170" height="70" rx="7" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<rect x="510" y="135" width="7" height="70" rx="3" fill="#e34948"/>
<text x="526" y="155" font-size="13" font-weight="700" fill="#0b0b0b">Coupe-batterie</text>
<text x="526" y="173.0" font-size="11.5" fill="#52514e">manuel, accessible</text>
<text x="526" y="188.5" font-size="11.5" fill="#52514e">coffre fermé</text>
<rect x="720" y="120" width="230" height="100" rx="7" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<rect x="720" y="120" width="7" height="100" rx="3" fill="#e34948"/>
<text x="736" y="140" font-size="13" font-weight="700" fill="#0b0b0b">Relais de sécurité (R1-05)</text>
<text x="736" y="158.0" font-size="11.5" fill="#52514e">double canal, contacts guidés</text>
<text x="736" y="173.5" font-size="11.5" fill="#52514e">piloté par l&#x27;arrêt d&#x27;urgence du</text>
<text x="736" y="189.0" font-size="11.5" fill="#52514e">pupitre et de la télécommande ;</text>
<text x="736" y="204.5" font-size="11.5" fill="#52514e">réarmement manuel</text>
<rect x="990" y="135" width="200" height="70" rx="7" fill="#ffffff" stroke="#eb6834" stroke-width="2.2"/>
<rect x="990" y="135" width="7" height="70" rx="3" fill="#eb6834"/>
<text x="1006" y="155" font-size="13" font-weight="700" fill="#0b0b0b">Barre + 12 V protégée</text>
<text x="1006" y="173.0" font-size="11.5" fill="#52514e">57 W ; 5,3 A en mesure</text>
<text x="1006" y="188.5" font-size="11.5" fill="#52514e">départs F1 à F8</text>
<rect x="1230" y="120" width="240" height="100" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
