<text x="1100" y="264" font-size="11" fill="#52514e" text-anchor="start">distribution + 12 V (les départs F5 à F8 se raccordent à la même barre)</text>
<rect x="30" y="630" width="330" height="150" rx="7" fill="#ffffff" stroke="#2a78d6" stroke-width="2.2"/>
<rect x="30" y="630" width="7" height="150" rx="3" fill="#2a78d6"/>
<text x="46" y="650" font-size="13" font-weight="700" fill="#0b0b0b">Signaux de temps (câble coaxial 50 Ω)</text>
<text x="46" y="668.0" font-size="11.5" fill="#52514e">10 MHz et 1 PPS de chaque horloge → comparateur</text>
<text x="46" y="683.5" font-size="11.5" fill="#52514e">1 PPS du GNSS → comparateur et calculateurs</text>
<text x="46" y="699.0" font-size="11.5" fill="#52514e">longueurs égales à ±5 cm (0,25 ns)</text>
<text x="46" y="714.5" font-size="11.5" fill="#52514e">blindage relié à la masse côté source seulement</text>
<text x="46" y="730.0" font-size="11.5" fill="#52514e">aucun câble de puissance dans la même gaine</text>
<rect x="400" y="630" width="330" height="150" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="2.2"/>
<rect x="400" y="630" width="7" height="150" rx="3" fill="#1baf7a"/>
<text x="416" y="650" font-size="13" font-weight="700" fill="#0b0b0b">Données</text>
<text x="416" y="668.0" font-size="11.5" fill="#52514e">comparateur → 3 calculateurs : 3 liaisons série</text>
<text x="416" y="683.5" font-size="11.5" fill="#52514e">isolées (optocoupleurs) : pas de masse commune</text>
<text x="416" y="699.0" font-size="11.5" fill="#52514e">capteurs : un jeu par calculateur si possible,</text>
<text x="416" y="714.5" font-size="11.5" fill="#52514e">sinon bus partagé (mode commun à signaler)</text>
<text x="416" y="730.0" font-size="11.5" fill="#52514e">calculateurs → voteur → pupitre : bus CAN</text>
<rect x="770" y="630" width="330" height="150" rx="7" fill="#ffffff" stroke="#e34948" stroke-width="2.2"/>
<rect x="770" y="630" width="7" height="150" rx="3" fill="#e34948"/>
<text x="786" y="650" font-size="13" font-weight="700" fill="#0b0b0b">Chaîne d&#x27;arrêt d&#x27;urgence (câblée)</text>
<text x="786" y="668.0" font-size="11.5" fill="#52514e">2 boutons à accrochage en série (pupitre,</text>
<text x="786" y="683.5" font-size="11.5" fill="#52514e">télécommande), double contact à ouverture ;</text>
<text x="786" y="699.0" font-size="11.5" fill="#52514e">ouvre le relais de sécurité : tout hors tension</text>
<text x="786" y="714.5" font-size="11.5" fill="#52514e">sauf la batterie elle-même ; aucun logiciel</text>
<text x="786" y="730.0" font-size="11.5" fill="#52514e">dans la chaîne ; essai avant chaque sortie</text>
<rect x="1140" y="630" width="330" height="150" rx="7" fill="#ffffff" stroke="#6b7280" stroke-width="2.2"/>
<rect x="1140" y="630" width="7" height="150" rx="3" fill="#6b7280"/>
<text x="1156" y="650" font-size="13" font-weight="700" fill="#0b0b0b">Séparations</text>
<text x="1156" y="668.0" font-size="11.5" fill="#52514e">baie gauche : énergie ; centre : logements et</text>
<text x="1156" y="683.5" font-size="11.5" fill="#52514e">boucle d&#x27;eau ; droite : temps et calcul ;</text>
<text x="1156" y="699.0" font-size="11.5" fill="#52514e">eau et électronique jamais au même niveau ;</text>
<text x="1156" y="714.5" font-size="11.5" fill="#52514e">pompe arrêtée pendant les mesures fines ;</text>
<text x="1156" y="730.0" font-size="11.5" fill="#52514e">horloges à plus de 25 cm de la batterie</text>
