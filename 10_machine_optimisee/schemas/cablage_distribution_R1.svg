<text x="1246" y="158.0" font-size="11.5" fill="#52514e">retours en étoile sur une barre 0 V</text>
<text x="1246" y="173.5" font-size="11.5" fill="#52514e">reliée au châssis en UN seul point ;</text>
<text x="1246" y="189.0" font-size="11.5" fill="#52514e">blindages reliés côté source ;</text>
<text x="1246" y="204.5" font-size="11.5" fill="#52514e">châssis relié au véhicule (tresse)</text>
