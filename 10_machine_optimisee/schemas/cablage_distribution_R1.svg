<rect x="770" y="300" width="7" height="110" rx="3" fill="#2a78d6"/>
<text x="786" y="320" font-size="13" font-weight="700" fill="#0b0b0b">F3 : fusible 2 A — 8,0 W (0,74 A)</text>
<text x="786" y="338.0" font-size="11.5" fill="#52514e">12 V direct</text>
<text x="786" y="353.5" font-size="11.5" fill="#52514e">régulation Peltier de l&#x27;enceinte,</text>
<text x="786" y="369.0" font-size="11.5" fill="#52514e">bobines de compensation (&lt; 1 mT)</text>
<text x="786" y="384.5" font-size="11.5" fill="#52514e">câble 0,5 mm²</text>
