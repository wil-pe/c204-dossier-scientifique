<path d="M360.0,435.0 L740.0,435.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#fl52514e)"/>
<text x="550.0" y="430.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#fcfcfb" stroke-width="4" paint-order="stroke">g, gradient vertical, dénivelés</text>
<path d="M1100.0,172.0 L1125.0,172.0 L1125.0,282.0 L1150.0,282.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#fl52514e)"/>
<path d="M1100.0,435.0 L1310.0,435.0 L1310.0,344.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#fl52514e)"/>
<path d="M360.0,592.0 L740.0,592.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#fl52514e)"/>
<text x="550.0" y="587.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#fcfcfb" stroke-width="4" paint-order="stroke">champ de hauteur de la surface</text>
<path d="M360.0,756.0 L740.0,756.0" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#fl52514e)"/>
<text x="550.0" y="751.0" font-size="10.5" fill="#52514e" text-anchor="middle" stroke="#fcfcfb" stroke-width="4" paint-order="stroke">coïncidences post-sélectionnées</text>
<rect x="1150" y="520" width="14" height="12" rx="2" fill="#2a78d6"/>
<text x="1172" y="530" font-size="11.5" fill="#0b0b0b" text-anchor="start">horloges (mesure)</text>
<rect x="1150" y="540" width="14" height="12" rx="2" fill="#eda100"/>
<text x="1172" y="550" font-size="11.5" fill="#0b0b0b" text-anchor="start">gravimétrie (mesure)</text>
<rect x="1150" y="560" width="14" height="12" rx="2" fill="#6250d6"/>
<text x="1172" y="570" font-size="11.5" fill="#0b0b0b" text-anchor="start">analogue hydrodynamique (simulation)</text>
<rect x="1150" y="580" width="14" height="12" rx="2" fill="#e87ba4"/>
<text x="1172" y="590" font-size="11.5" fill="#0b0b0b" text-anchor="start">optique quantique (simulation)</text>
<rect x="1150" y="600" width="14" height="12" rx="2" fill="#1baf7a"/>
<text x="1172" y="610" font-size="11.5" fill="#0b0b0b" text-anchor="start">calcul, vote, test</text>
<rect x="1150" y="620" width="14" height="12" rx="2" fill="#0b0b0b"/>
<text x="1172" y="630" font-size="11.5" fill="#0b0b0b" text-anchor="start">résultat</text>
<text x="1150" y="670" font-size="11.5" font-weight="700" fill="#0b0b0b" text-anchor="start">Simulation ≠ expérience sur l&#x27;espace-temps :</text>
<text x="1150" y="688" font-size="11.5" fill="#52514e" text-anchor="start">M3 et M4 reproduisent des équations,</text>
<text x="1150" y="704" font-size="11.5" fill="#52514e" text-anchor="start">pas une courbure ni une boucle causale.</text>
</svg>
